[project]
name = "mobilebot-tools"
version = "0.1.0"
description = "Layer A -> Layer B extraction and dataset review for the mobilebot project. No ROS install required."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Praveenbabu R S" }]
dependencies = [
    "mcap>=1.1.0",
    "mcap-ros2-support>=0.5.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
view = ["opencv-python-headless>=4.8", "matplotlib>=3.7"]
# Training deps are optional: the robot-side and data-review workflows must not
# require torch. Install with: pip install -e '.[training]'
training = [
    "torch>=2.0",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "matplotlib>=3.7",
]
dashboard = [
    "torch>=2.0",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "matplotlib>=3.7",
    "streamlit>=1.30",
]

[project.scripts]
mobilebot-extract = "mobilebot_tools.extract:main"
mobilebot-merge = "mobilebot_tools.merge:main"
mobilebot-validate = "mobilebot_tools.validate:main"
mobilebot-view = "mobilebot_tools.view:main"
mobilebot-curate = "mobilebot_tools.curate:main"
mobilebot-stats = "mobilebot_tools.stats:main"
mobilebot-train = "mobilebot_tools.train:main"
mobilebot-export = "mobilebot_tools.export:main"
mobilebot-dashboard = "mobilebot_tools.dashboard_launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
